# Tarea diaria del Robot Panaderia (Decisiones Pendientes #14 y #20) - 2-oct-2026
#
# Que hace: todos los dias a las 7:00 a. m. de Costa Rica, GitHub enciende una
# computadora temporal (Ubuntu 24.04 + LibreOffice 24.2, igual que el bot en Render),
# baja el codigo del repositorio y corre, en este orden, los MISMOS comandos de la PC:
#   0) Respaldo diario: copia el Excel maestro al archivo de respaldo de Drive (|| 2-oct-2026)
#   1) NODO INTEGRAL (clima, tipo de cambio, feriados, dias de pago -> combos del dia)
#   2) Precios de proveedores (Solera y MaxiPali)
#   3) Competencia (Musi, con Gemini y el cache del Excel CACHE_COMPETENCIA de Drive)
# Cada comando escribe en el Excel maestro de Google Drive con la misma funcion de
# siempre (descargar -> editar -> recalcular -> subir).
#
# Las claves NUNCA van en este archivo: GitHub las guarda cifradas en
#   Settings -> Secrets and variables -> Actions
# y aqui solo se nombran (secrets.NOMBRE). Son 4:
#   EXCEL_MAESTRO_FILE_ID, GOOGLE_SERVICE_ACCOUNT_JSON, CACHE_COMPETENCIA_FILE_ID, GEMINI_API_KEY
# || 2-oct-2026 (respaldo diario): y un 5o, RESPALDO_MAESTRO_FILE_ID (ID o enlace del archivo
#   de respaldo en Drive; su nombre debe contener la palabra RESPALDO).
#
# Si un paso falla, los siguientes igual se intentan y la corrida queda marcada en
# rojo (GitHub avisa por correo). Cada microservicio ya protege el Excel: si una
# fuente falla, la celda conserva su ultimo valor (Regla #19).
#
# || 3-oct-2026 (Decisiones Pendientes #56):
#   a) RESPALDO MANUAL: los sitios de Solera y Musi le piden una verificacion contra robots
#      a los servidores de nube. Cuando no responden, los pasos 2 y 3 usan el archivo mas
#      nuevo de la carpeta de respaldos de Drive (6o Secret: RESPALDO_FUENTES_FOLDER_ID),
#      que la administracion actualiza con Ctrl + S desde un navegador cada 10 dias.
#   b) HORARIO: la corrida automatica de las 7:00 del 3-oct no salio (GitHub puede atrasar o
#      descartar las tareas programadas a la hora en punto). Se mueve a las 6:17 a. m. CR
#      (12:17 UTC): fuera de la hora en punto y con margen para estar lista antes de las 7:00.
#      El nombre de la tarea no cambia, para no partir el historial de corridas.
#
# || 4-oct-2026 (Decisiones Pendientes #57, decision del usuario, opcion B): DOS HORARIOS.
#   La corrida programada volvio a salir a las 12:18 p. m. CR: el 3-oct (pedida a las 7:00)
#   con 5 h 18 min de atraso y el 4-oct (pedida a las 6:17) con 6 h 01 min. Cambiar el minuto
#   no quito el atraso. PRUEBA: pedir la tarea a las 12:17 a. m. y a las 6:17 a. m. CR.
#     - Si GitHub atrasa unas 6 horas: sale cerca de las 6:17 a. m. y de las 12:18 p. m.
#     - Si GitHub es puntual: sale a las 12:17 a. m. y a las 6:17 a. m. (la segunda deja el
#       clima de la manana, porque NODO INTEGRAL usa la temperatura del momento).
#     - Si las dos salen al mediodia: mover la hora no sirve (queda el disparador externo).
#   Correr dos veces NO duplica datos: cada corrida escribe en las mismas celdas; solo quedan
#   mas renglones en 'RegistroEventos' (evidencia de la hora real) y el respaldo se repite.

name: Tarea diaria 7:00 CR

on:
  schedule:
    # 13:00 UTC = 7:00 a. m. en Costa Rica (UTC-6 todo el ano, sin horario de verano).
    # GitHub puede empezar unos minutos tarde cuando tiene mucha carga.
    # || 3-oct-2026: antes "0 13 * * *" (7:00 CR en punto). Ahora 12:17 UTC = 6:17 a. m. CR.
    # || 4-oct-2026 (#57): dos horarios (ver el encabezado). Las horas de GitHub son UTC.
    - cron: "17 6 * * *"     # 06:17 UTC = 12:17 a. m. CR (nuevo)
    - cron: "17 12 * * *"    # 12:17 UTC = 6:17 a. m. CR (el de antes, se conserva)
  workflow_dispatch:      # boton "Run workflow": correrla a mano cuando se quiera

concurrency:
  group: tarea-diaria     # nunca dos corridas al mismo tiempo
  cancel-in-progress: false

permissions:
  contents: read          # la tarea solo LEE el repositorio

jobs:
  tarea:
    name: NODO + precios + competencia
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORIGEN_EXCEL: drive
      RECALCULAR: "si"
      ZONA_HORARIA: America/Costa_Rica
      LIMITE_CAMBIO_PRECIO: "0.5"
      PYTHONUNBUFFERED: "1"
      EXCEL_MAESTRO_FILE_ID: ${{ secrets.EXCEL_MAESTRO_FILE_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CACHE_COMPETENCIA_FILE_ID: ${{ secrets.CACHE_COMPETENCIA_FILE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESPALDO_MAESTRO_FILE_ID: ${{ secrets.RESPALDO_MAESTRO_FILE_ID }}
      RESPALDO_FUENTES_FOLDER_ID: ${{ secrets.RESPALDO_FUENTES_FOLDER_ID }}
    steps:
      - name: Bajar el codigo del repositorio
        uses: actions/checkout@v6

      - name: Preparar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar LibreOffice (recalcula las formulas del Excel)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-core fonts-dejavu-core
          soffice --version

      - name: Instalar las librerias del robot
        run: pip install -r requirements.txt

      - name: 0) Respaldo diario del Excel maestro
        run: python -m conexion_drive.respaldo_diario

      - name: 1) NODO INTEGRAL
        if: ${{ !cancelled() }}
        run: python -m microservicios.grupo3_integraciones.nodo_integral

      - name: 2) Precios de proveedores
        if: ${{ !cancelled() }}
        run: python -m microservicios.grupo3_integraciones.precios_proveedores

      - name: 3) Competencia (Musi)
        if: ${{ !cancelled() }}
        run: python -m microservicios.grupo3_integraciones.competencia
